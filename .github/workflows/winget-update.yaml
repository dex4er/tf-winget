name: Automated WinGet update

# The manifests reach microsoft/winget-pkgs through the fork
# dex4er/winget-pkgs. This repository holds only the templates and the
# tooling, so that nothing here, Renovate included, clones the history of
# winget-pkgs. The fork is checked out shallow, without blobs, and sparse:
# the top commit of its master and the manifests of tf only.
on:
  issue_comment:
    types:
      - created
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  winget-update:
    name: WinGet update

    runs-on: ubuntu-24.04-arm
    environment: automated
    timeout-minutes: 15

    if: github.event_name != 'issue_comment' || contains(github.event.comment.body, '/rerun')

    env:
      DO_NOT_TRACK: "1"
      FORK: dex4er/winget-pkgs
      UPSTREAM: microsoft/winget-pkgs
      PACKAGE_DIR: manifests/d/dex4er/tf

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # mise-action adds --locked on its own when a lockfile is present, so
      # yq and yamlfmt are verified against mise.lock.
      - name: Install mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.19 # datasource=github-releases depName=jdx/mise

      - name: Set version
        run: |
          echo "version=$(yq -r '.tf' .versions.yaml)" | tee -a "$GITHUB_ENV"

      # The master of the fork is brought up to the upstream one through the
      # API, without a clone. The version branch is committed on top of it, so
      # its parent is a commit the fork already has, which a push from a
      # shallow clone needs.
      - name: Sync the master branch of the fork
        run: gh repo sync "$FORK" --branch master
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      # Only the top commit of master, without blobs, and only the manifests of
      # tf in the working tree: the history and the tree of winget-pkgs are far
      # too big to clone. gh serves as the credential helper, so the push below
      # authenticates with GH_TOKEN and the token never lands in .git/config.
      - name: Clone the master branch of the fork
        run: |
          gh auth setup-git
          git clone --depth 1 --filter=blob:none --sparse --single-branch --branch master \
            "https://github.com/${FORK}.git" winget-pkgs
          git -C winget-pkgs sparse-checkout set "$PACKAGE_DIR"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Check if the package and the version already exist
        run: |
          if [[ -d winget-pkgs/$PACKAGE_DIR/$version ]]; then
            echo "pr_type=Update" | tee -a "$GITHUB_ENV"
          elif [[ -d winget-pkgs/$PACKAGE_DIR ]]; then
            echo "pr_type=New version" | tee -a "$GITHUB_ENV"
          else
            echo "pr_type=New package" | tee -a "$GITHUB_ENV"
          fi

      # make.sh writes to manifests/ of the working directory, which points
      # into the checkout of the fork.
      - name: Generate new manifests
        run: |
          ln -s winget-pkgs/manifests manifests
          bash -x make.sh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Check for changes
        run: |
          if [[ -n "$(git -C winget-pkgs status --porcelain)" ]]; then
            echo "changes=true" | tee -a "$GITHUB_ENV"
          else
            echo "changes=false" | tee -a "$GITHUB_ENV"
          fi

      - name: Commit and push to branch
        if: env.changes == 'true'
        uses: EndBug/add-and-commit@v11
        with:
          cwd: winget-pkgs
          github_token: ${{ secrets.GH_TOKEN }}
          default_author: github_actions
          add: ${{ env.PACKAGE_DIR }}
          message: "${{ env.pr_type }}: dex4er.tf version ${{ env.version }}"
          new_branch: dex4er-tf-${{ env.version }}
          fetch: false
          push: origin dex4er-tf-${{ env.version }} --set-upstream --force
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      # A new package is reviewed by a moderator of winget-pkgs, who learns
      # from the description what tf is; a new version links its notes. The
      # boxes of the checklist that the workflow does not verify stay empty.
      - name: Write the description of the pull request
        if: env.changes == 'true'
        run: |-
          locale="manifests/d/dex4er/tf/${version}/dex4er.tf.locale.en-US.yaml"
          package_url=$(yq -r .PackageUrl "$locale")
          short_description=$(yq -r .ShortDescription "$locale")
          export VERSION="$version"
          RELEASE_URL=$(yq -r .ReleaseNotesUrl "$locale")
          export RELEASE_URL
          MANIFEST_VERSION=$(yq -r .ManifestVersion "$locale")
          export MANIFEST_VERSION
          case "$pr_type" in
            "New package")
              DESCRIPTION="Adds the package \`dex4er.tf\` of [tf](${package_url}) version ${version}: ${short_description}. It installs the portable binary of the release for x64 or arm64 as the command \`tf\`."
              ;;
            "New version")
              DESCRIPTION="Adds version ${version} of \`dex4er.tf\`, [tf](${package_url}). Its changes are in the [release notes](${RELEASE_URL})."
              ;;
            *)
              DESCRIPTION="Updates the manifests of version ${version} of \`dex4er.tf\`, [tf](${package_url})."
              ;;
          esac
          export DESCRIPTION
          perl -pe 's/\$\{(\w+)\}/$ENV{$1} \/\/ die "No value of $1\n"/ge' template/pull-request.md > pr_body.md
          cat pr_body.md

      - name: Create pull request
        if: env.changes == 'true'
        run: |-
          if [[ $(gh pr view \
            --repo "$UPSTREAM" \
            --json state \
            --jq .state \
            "dex4er:dex4er-tf-${version}" || true) != "OPEN" ]];
          then
            gh pr create \
              --repo "$UPSTREAM" \
              --base master \
              --head "dex4er:dex4er-tf-${version}" \
              --title "${pr_type}: dex4er.tf version ${version}" \
              --body-file pr_body.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
